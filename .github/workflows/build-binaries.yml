name: PlatformIO Firmware Build & Export

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      pio_env:
        description: 'PlatformIO Build Environment'
        required: true
        default: 'd1_mini_ota'
        type: choice
        options:
          - d1_mini_ota
          - d1_mini_usb

jobs:
  # =========================================================================
  # PRIMARY JOB: Build firmware using Docker and output binaries as artifacts
  # =========================================================================
  build-and-export:
    name: Build & Export Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build firmware and export binaries via Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          target: export
          # Pass the build environment (defaults to pio_env input, or fallback if push/pull_request)
          build-args: |
            PIO_ENV=${{ github.event.inputs.pio_env || 'd1_mini_ota' }}
            WIFI_SSID=${{ secrets.WIFI_SSID }}
            WIFI_PASS=${{ secrets.WIFI_PASS }}
          # Export compiled binaries directly to a local directory using BuildKit local exporter
          outputs: type=local,dest=./build_output

      - name: Upload microcontroller binaries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries-${{ github.event.inputs.pio_env || 'd1_mini_ota' }}
          path: ./build_output/firmware.*
          if-no-files-found: error
          retention-days: 14

